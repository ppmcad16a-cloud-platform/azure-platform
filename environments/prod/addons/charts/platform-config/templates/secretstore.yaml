# ONE secret store for the whole cluster, with the SAME NAME in every cloud
# ("cloud-vault"), so the app manifests never need to know which cloud
# they run in. Only the provider block differs per cloud.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cloud-vault
spec:
  provider:
    {{- toYaml .Values.secretStore | nindent 4 }}
