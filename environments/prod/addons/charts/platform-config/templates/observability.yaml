# ---------------------------------------------------------------
# Observability plumbing for this cluster.
# ---------------------------------------------------------------
# Slack webhook for Alertmanager, copied from the vault. Alertmanager
# mounts it as a FILE (alertmanagerSpec.secrets) - never in its config.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cloud-vault
  target:
    name: alertmanager-slack
  data:
    - secretKey: url
      remoteRef:
        key: mern-slack-webhook-url
{{- with .Values.observability.backendsHostname }}
---
# obs-<cloud>.<domain>: this cluster's Prometheus (/prom) and Loki (/loki)
# for the central Grafana in GKE. Cloudflare Access lets only Grafana's
# service token (or an admin) through. GET only: nobody can push data
# or change anything through this door.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: observability-backends
  namespace: monitoring
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - {{ . | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /prom
          method: GET
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: kps-prometheus
          port: 9090
    - matches:
        - path:
            type: PathPrefix
            value: /loki
          method: GET
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: loki
          port: 3100
{{- end }}
{{- with .Values.observability.grafanaHostname }}
---
# The central Grafana's service token for the other clusters' backends,
# as environment variables CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cf-access
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cloud-vault
  target:
    name: grafana-cf-access
  data:
    - secretKey: CF_ACCESS_CLIENT_ID
      remoteRef:
        key: grafana-cf-access-client-id
    - secretKey: CF_ACCESS_CLIENT_SECRET
      remoteRef:
        key: grafana-cf-access-client-secret
---
# grafana.<domain> -> the central Grafana (Cloudflare Access: admins only).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - {{ . | quote }}
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
{{- end }}
