# Namespace for the shop. The label lets its routes use the public gateway.
# Pod Security: "baseline" is enforced, "restricted" (stricter) only warns.
apiVersion: v1
kind: Namespace
metadata:
  name: mern
  labels:
    gateway-access: "true"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
# Monitoring tools (Prometheus, Loki, Grafana). The label lets the
# Grafana / obs-<cloud> routes use the public gateway.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    gateway-access: "true"
